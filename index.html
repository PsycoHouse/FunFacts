<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Private Random Facts auf Knopfdruck.">
    <title>Random Fact</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">RANDOM FACT</p>

      <section id="login-view" class="panel login-panel" aria-labelledby="login-title">
        <h1 id="login-title">Willkommen</h1>
        <p class="intro">Melde dich an, um etwas Überraschendes zu erfahren.</p>
        <form id="login-form">
          <label for="username">Benutzername</label>
          <input id="username" name="username" autocomplete="username" required maxlength="128">
          <label for="password">Passwort</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
          <button id="login-button" class="primary" type="submit">ANMELDEN</button>
        </form>
        <p id="login-status" class="status" role="alert"></p>
      </section>

      <section id="app-view" class="panel" hidden>
        <div class="toolbar"><button id="logout-button" class="text-button" type="button">Abmelden</button></div>
        <div class="brain" aria-hidden="true">🧠</div>
        <div class="fact-card" aria-live="polite" aria-atomic="true">
          <span id="category" class="category" hidden></span>
          <p id="fact" class="fact">Bereit für etwas Neues?</p>
          <button id="copy-button" class="text-button" type="button" hidden>Fact kopieren</button>
        </div>
        <p id="status" class="status" role="alert"></p>
        <button id="fact-button" class="primary" type="button">NÄCHSTER FACT</button>
        <p id="daily-counter" class="counter">– / 20 heute genutzt</p>
        <p id="counter" class="counter">0 Facts insgesamt gesehen</p>
        <button id="reset-button" class="text-button reset" type="button">Verlauf zurücksetzen</button>
      </section>
    </main>
  </body>
</html>
